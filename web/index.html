<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vega</title>
<style>
:root{--sky:#070b18;--star:#e3ecff;--gold:#ffc46b;--violet:#a394ff;--cyan:#6fe3ff;--dim:#7d89aa;--line:#1c2540}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(120% 90% at 50% 40%,#0f1630,var(--sky));color:var(--star);
 font:16px/1.5 Bahnschrift,"Segoe UI",system-ui,sans-serif;display:grid;
 grid-template-columns:1fr minmax(0,420px);grid-template-rows:1fr auto;height:100vh;overflow:hidden}
#stage{grid-row:1/3;position:relative;display:grid;place-items:center}
canvas{width:min(78vmin,640px);height:min(78vmin,640px)}
#state{position:absolute;bottom:7vh;font-size:1.05rem;letter-spacing:.04em;color:var(--dim)}
aside{padding:28px 24px 12px;display:flex;flex-direction:column;gap:16px;min-height:0;border-left:1px solid var(--line)}
#log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px}
.m{max-width:92%;padding:2px 0}
.you{align-self:flex-end;color:var(--gold);text-align:right}
.vega{color:var(--star)}
.tool{color:var(--violet);font-size:.85rem;border-left:2px solid var(--violet);padding-left:10px}
.err{color:#ff8e8e}
form{display:flex;gap:8px;padding:0 24px 24px;grid-column:2}
input{flex:1;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--star);font:inherit;padding:8px 2px}
input:focus-visible,button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
button{background:transparent;color:var(--star);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font:inherit;cursor:pointer}
button:hover{border-color:var(--cyan)}
#mic[aria-pressed=true],#hf[aria-pressed=true]{border-color:var(--gold);color:var(--gold)}
@media(max-width:760px){body{grid-template-columns:1fr;grid-template-rows:38vh 1fr auto}
 #stage{grid-row:1}canvas{width:34vh;height:34vh}#state{bottom:1vh}aside{border:0;grid-row:2;padding-top:8px}form{grid-column:1}}
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="900" height="900" aria-hidden="true"></canvas><div id="state" role="status">Click the mic or type to begin.</div></div>
<aside><div id="log" aria-live="polite"></div></aside>
<form id="f"><input id="t" placeholder="Ask Vega anything" autocomplete="off" aria-label="Message">
<button type="button" id="mic" aria-pressed="false">Mic</button><button type="button" id="hf" aria-pressed="false">Hands-free</button><button>Send</button></form>
<script>
const $=id=>document.getElementById(id), log=$("log"), stateEl=$("state");
const COLORS={idle:"#e3ecff",listening:"#ffc46b",thinking:"#a394ff",speaking:"#6fe3ff"};
const LABELS={idle:"Ready",listening:"Listening",thinking:"Thinking",speaking:"Speaking"};
let mode="idle", ws, rec, micOn=false;
let always=false;
const setMode=m=>{mode=m;stateEl.textContent=(m==="idle"&&always)?"Say \u201CHey Vega\u201D":LABELS[m]};
const add=(cls,txt)=>{const d=document.createElement("div");d.className="m "+cls;d.textContent=txt;log.append(d);log.scrollTop=1e9};

function connect(){
  ws=new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage=e=>{const m=JSON.parse(e.data);
    if(m.type==="reply"){add("vega",m.text);say(m.text)}
    else if(m.type==="tool")add("tool","using "+m.name.replace(/_/g," "));
    else if(m.type==="notice"){add("vega",m.text);say(m.text)}
    else if(m.type==="error"){add("err",m.text);setMode("idle")}};
  ws.onclose=()=>{setMode("idle");stateEl.textContent="Disconnected. Restart Vega and refresh.";};
}
function send(text){if(!text||ws.readyState!==1)return;add("you",text);setMode("thinking");ws.send(JSON.stringify({text}))}
let cloneOn=false,greeting="",greeted=false;
const greetOnce=()=>{if(greeting&&!greeted){greeted=true;say(greeting)}};
async function say(text){
  speechSynthesis.cancel();
  if(cloneOn){try{
    setMode("thinking");
    const r=await fetch("/speak",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text})});
    if(!r.ok)throw 0;
    const a=new Audio(URL.createObjectURL(await r.blob()));
    a.onplay=()=>setMode("speaking");a.onended=()=>{setMode("idle");if(micOn&&!always)startRec()};
    return a.play();
  }catch(e){}}
  const u=new SpeechSynthesisUtterance(text);
  u.onstart=()=>setMode("speaking");u.onend=()=>{setMode("idle");if(micOn&&!always)startRec()};
  speechSynthesis.speak(u);
}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const WAKE=/\b(hey|hi|ok|okay)[ ,]+(vega|vegas|veda|vaiga)\b/i;
let armed=0;
function heard(t){  // hands-free: react only after the wake word
  if(mode==="speaking"||mode==="thinking")return;
  const m=t.match(WAKE);
  if(m){const rest=t.slice(m.index+m[0].length).replace(/^[\s,.!?]+/,"");
    if(rest)send(rest);else{armed=Date.now()+8000;setMode("listening")}}
  else if(Date.now()<armed){armed=0;send(t)}
}
function startRec(){
  if(!SR){add("err","Voice input needs Chrome or Edge. You can still type.");micOn=always=false;sync();return}
  if(rec){rec.onend=null;try{rec.abort()}catch(e){}}
  rec=new SR();rec.lang="en-US";rec.continuous=always;
  rec.onstart=()=>{if(!always)setMode("listening")};
  rec.onresult=e=>{const t=e.results[e.results.length-1][0].transcript.trim();always?heard(t):send(t)};
  rec.onerror=ev=>{if(ev.error==="not-allowed"||ev.error==="service-not-allowed"){always=micOn=false;sync();setMode("idle");add("err","Microphone blocked. Allow it in Chrome's address bar, then try again.")}};
  rec.onend=()=>{if(always)setTimeout(startRec,300);else if(mode==="listening")setMode("idle")};
  rec.start();
}
function sync(){$("mic").setAttribute("aria-pressed",micOn);$("hf").setAttribute("aria-pressed",always)}
$("mic").onclick=()=>{micOn=!micOn;always=false;sync();speechSynthesis.cancel();micOn?startRec():(rec&&(rec.onend=null,rec.abort()),setMode("idle"))};
$("hf").onclick=()=>{always=!always;micOn=false;sync();
  if(always){greetOnce();startRec();setMode("idle")}else{if(rec){rec.onend=null;rec.abort()}setMode("idle")}};
$("f").onsubmit=e=>{e.preventDefault();send($("t").value.trim());$("t").value=""};

// The star: a four-point diffraction star with an orbiting ring. Colour and tempo follow the state.
const cv=$("c"),g=cv.getContext("2d"),still=matchMedia("(prefers-reduced-motion: reduce)").matches;
let hue=[227,236,255],cur=[227,236,255];
function hex(h){return[1,3,5].map(i=>parseInt(h.substr(i,2),16))}
function frame(t){
  const tgt=hex(COLORS[mode]);cur=cur.map((v,i)=>v+(tgt[i]-v)*.06);
  const c=cur.map(Math.round).join(","),s=still?0:t/1000;
  const pace={idle:.6,listening:2.2,thinking:4,speaking:3}[mode];
  const pulse=1+.08*Math.sin(s*pace*2),W=900,m=W/2;
  g.clearRect(0,0,W,W);
  const glow=g.createRadialGradient(m,m,0,m,m,300*pulse);
  glow.addColorStop(0,`rgba(${c},.55)`);glow.addColorStop(.25,`rgba(${c},.14)`);glow.addColorStop(1,`rgba(${c},0)`);
  g.fillStyle=glow;g.fillRect(0,0,W,W);
  for(const [len,w,rot] of [[400,5,0],[400,5,Math.PI/2],[230,3,Math.PI/4],[230,3,-Math.PI/4]]){
    g.save();g.translate(m,m);g.rotate(rot+s*.05);
    const lg=g.createLinearGradient(-len,0,len,0);
    lg.addColorStop(0,`rgba(${c},0)`);lg.addColorStop(.5,`rgba(${c},.9)`);lg.addColorStop(1,`rgba(${c},0)`);
    g.fillStyle=lg;g.beginPath();g.moveTo(-len*pulse,0);g.lineTo(0,-w);g.lineTo(len*pulse,0);g.lineTo(0,w);g.fill();g.restore();
  }
  g.fillStyle=`rgb(${c})`;
  const n=48;for(let i=0;i<n;i++){const a=i/n*Math.PI*2+s*.25*pace/2,r=190+(i%2?10:0);
    g.globalAlpha=.25+.6*((Math.sin(a*3+s*pace)+1)/2);g.beginPath();g.arc(m+Math.cos(a)*r,m+Math.sin(a)*r,i%4?2:3.5,0,7);g.fill()}
  g.globalAlpha=1;g.beginPath();g.arc(m,m,16*pulse,0,7);g.fill();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);connect();
fetch("/config").then(r=>r.json()).then(c=>{cloneOn=c.clone;
  const hr=new Date().getHours(),part=hr<12?"morning":hr<17?"afternoon":"evening";
  greeting=`Good ${part}${c.user?", "+c.user:""}. Vega online.`;add("vega",greeting)}).catch(()=>{});
</script>
</body>
</html>
