<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VEGA</title>
<style>
:root{--bg:#05010d;--cy:#05d9e8;--mg:#ff2a6d;--yl:#f9f002;--gr:#00ff9f;--vi:#b967ff;--txt:#d1f7ff;--dim:#6b7a99;--line:rgba(5,217,232,.28)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(90% 70% at 50% 30%,#1b0636 0%,#0a0220 48%,var(--bg) 100%);color:var(--txt);
 font:16px/1.5 Bahnschrift,Consolas,"Segoe UI",system-ui,monospace;height:100vh;overflow:hidden;
 display:grid;grid-template-columns:1fr minmax(0,440px);grid-template-rows:auto 1fr auto}
/* moving neon floor grid + scanlines */
body::before{content:"";position:fixed;left:-50%;right:-50%;bottom:0;height:46vh;z-index:0;pointer-events:none;
 background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
 background-size:64px 64px;transform:perspective(420px) rotateX(62deg);transform-origin:bottom;
 -webkit-mask-image:linear-gradient(to top,#000,transparent);mask-image:linear-gradient(to top,#000,transparent);
 animation:floor 3s linear infinite}
@keyframes floor{to{background-position:0 64px}}
body::after{content:"";position:fixed;inset:0;z-index:60;pointer-events:none;
 background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px);animation:flick 6s steps(1) infinite}
@keyframes flick{0%,96%,100%{opacity:1}97%{opacity:.82}98%{opacity:1}99%{opacity:.9}}
header{grid-column:1/3;display:flex;align-items:center;gap:18px;padding:14px 26px;border-bottom:1px solid var(--line);position:relative;z-index:2;
 background:linear-gradient(90deg,rgba(255,42,109,.10),transparent 40%,rgba(5,217,232,.10))}
h1{font:700 1.5rem Bahnschrift,Consolas,monospace;letter-spacing:.45em;color:var(--cy);
 text-shadow:2px 0 var(--mg),-2px 0 var(--yl),0 0 14px rgba(5,217,232,.8);animation:glitch 5s infinite}
@keyframes glitch{0%,90%,100%{transform:none}91%{transform:translate(-3px,1px) skewX(-6deg)}93%{transform:translate(3px,-1px)}95%{transform:none}}
.chips{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--line);padding:2px 9px;color:var(--dim)}
.chip.on{color:var(--gr);border-color:var(--gr);text-shadow:0 0 8px var(--gr)}
#clock{color:var(--yl);border-color:rgba(249,240,2,.4)}
#stage{position:relative;display:grid;place-items:center;z-index:1;min-height:0}
canvas{width:min(74vmin,660px);height:min(74vmin,660px);filter:drop-shadow(0 0 22px rgba(5,217,232,.35))}
#state{position:absolute;bottom:5vh;font-size:1.05rem;letter-spacing:.38em;text-transform:uppercase;color:var(--cy);text-shadow:0 0 10px currentColor}
#state::after{content:"_";animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
aside{position:relative;z-index:1;margin:14px 20px 0 0;padding:20px 20px 12px;display:flex;flex-direction:column;min-height:0;
 border:1px solid var(--line);background:rgba(8,2,26,.72);box-shadow:inset 0 0 40px rgba(5,217,232,.08),0 0 30px rgba(255,42,109,.08)}
aside::before,aside::after{content:"";position:absolute;width:18px;height:18px;border:2px solid var(--mg)}
aside::before{top:-2px;left:-2px;border-right:0;border-bottom:0}
aside::after{bottom:-2px;right:-2px;border-left:0;border-top:0}
#log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:14px;padding-right:6px;scrollbar-width:thin;scrollbar-color:var(--mg) transparent}
.m{max-width:96%;white-space:pre-wrap;overflow-wrap:anywhere;animation:in .35s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.m::before{display:block;font-size:.68rem;letter-spacing:.25em;margin-bottom:1px}
.you{align-self:flex-end;color:var(--yl);text-align:right}.you::before{content:"YOU //";color:var(--yl);opacity:.7}
.vega{color:var(--txt)}.vega::before{content:"VEGA //";color:var(--cy)}
.draft{border:1px solid var(--mg);padding:10px 12px;background:rgba(255,42,109,.06);box-shadow:0 0 14px rgba(255,42,109,.15)}
.draft button{display:block;margin-top:8px;font-size:.75rem;padding:3px 12px}
.tool{color:var(--vi);font-size:.82rem;border-left:2px solid var(--vi);padding-left:10px}.tool::before{content:none}
.err{color:#ff8e8e;border-left:2px solid var(--mg);padding-left:10px}.err::before{content:"ALERT //";color:var(--mg)}
form{grid-column:1/3;display:flex;gap:8px;padding:14px 26px 22px;align-items:center;position:relative;z-index:2;
 background:linear-gradient(0deg,rgba(5,1,13,.9),transparent)}
form::before{content:">";color:var(--mg);font-weight:700;text-shadow:0 0 8px var(--mg)}
input,select{background:rgba(5,1,13,.6);border:0;border-bottom:1px solid var(--cy);color:var(--txt);font:inherit;padding:8px 6px}
input{flex:1;min-width:0}
select{border:1px solid var(--line);border-radius:0;padding:8px 6px;max-width:150px}
select option{background:#0a0220}
input:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--yl);outline-offset:3px}
button{background:transparent;color:var(--cy);border:1px solid var(--cy);padding:8px 16px;font:inherit;cursor:pointer;text-transform:uppercase;letter-spacing:.1em;font-size:.82rem;
 clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);transition:.15s}
button:hover{background:rgba(5,217,232,.15);box-shadow:0 0 14px rgba(5,217,232,.5)}
#mic[aria-pressed=true],#hf[aria-pressed=true]{color:var(--yl);border-color:var(--yl);box-shadow:0 0 14px rgba(249,240,2,.5);animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 4px rgba(249,240,2,.2)}}
@media(max-width:860px){body{grid-template-columns:1fr;grid-template-rows:auto 38vh 1fr auto}
 header,form{grid-column:1}aside{grid-row:3;margin:0 12px}canvas{width:34vh;height:34vh}#state{bottom:1vh}
 .chips{display:none}form{flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){h1,body::after{animation:none}}
</style>
</head>
<body>
<header><h1>VEGA</h1>
 <div class="chips"><span class="chip" id="cModel">model</span><span class="chip" id="cClone">voice: browser</span><span class="chip" id="cGoogle">google: off</span><span class="chip" id="clock">--:--:--</span></div></header>
<div id="stage"><canvas id="c" width="900" height="900" aria-hidden="true"></canvas><div id="state" role="status">Click the mic or type to begin</div></div>
<aside><div id="log" aria-live="polite"></div></aside>
<form id="f"><input id="t" placeholder="Ask Vega anything, in any Indian language" autocomplete="off" aria-label="Message">
<select id="lang" aria-label="Voice language">
 <option value="en-IN">English</option><option value="hi-IN">हिन्दी Hindi</option><option value="kn-IN">ಕನ್ನಡ Kannada</option>
 <option value="te-IN">తెలుగు Telugu</option><option value="ta-IN">தமிழ் Tamil</option><option value="ml-IN">മലയാളം Malayalam</option>
 <option value="mr-IN">मराठी Marathi</option><option value="bn-IN">বাংলা Bengali</option><option value="gu-IN">ગુજરાતી Gujarati</option>
 <option value="pa-IN">ਪੰਜਾਬੀ Punjabi</option><option value="ur-IN">اردو Urdu</option></select>
<select id="spd" aria-label="Voice speed"><option value="0.7">Speed 0.7x</option><option value="0.8">Speed 0.8x</option><option value="0.85">Speed 0.85x</option><option value="0.9">Speed 0.9x</option><option value="1">Speed 1x</option><option value="1.1">Speed 1.1x</option></select>
<button type="button" id="mic" aria-pressed="false">Mic</button><button type="button" id="hf" aria-pressed="false">Hands-free</button><button>Send</button></form>
<script>
const $=id=>document.getElementById(id), log=$("log"), stateEl=$("state");
const COLORS={idle:"#05d9e8",listening:"#f9f002",thinking:"#ff2a6d",speaking:"#00ff9f"};
const LABELS={idle:"Ready",listening:"Listening",thinking:"Thinking",speaking:"Speaking"};
let mode="idle",ws,rec,micOn=false,always=false,paused=false,armed=0,cloneOn=false,curAudio=null;
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let LANG=store.get("vega-lang")||"en-IN";$("lang").value=LANG;
let SPEED=parseFloat(store.get("vega-speed")||"0.85");$("spd").value=String(SPEED);
const calm=new URLSearchParams(location.search).has("calm");
const setMode=m=>{mode=m;stateEl.textContent=(m==="idle"&&always)?"Say \u201CHey Vega\u201D":LABELS[m]};
function add(cls,txt,draft){const d=document.createElement("div");d.className="m "+cls+(draft?" draft":"");d.textContent=txt;
  if(draft){const b=document.createElement("button");b.type="button";b.textContent="Copy";
    b.onclick=()=>navigator.clipboard.writeText(txt).then(()=>{b.textContent="Copied"},()=>{});d.append(b)}
  log.append(d);log.scrollTop=1e9}

function connect(){
  ws=new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage=e=>{const m=JSON.parse(e.data);
    if(m.type==="reply"){add("vega",m.text,m.say!==undefined&&m.say!==m.text);say(m.say!==undefined?m.say:m.text)}
    else if(m.type==="tool")add("tool","using "+m.name.replace(/_/g," "));
    else if(m.type==="notice"){add("vega",m.text);say(m.text)}
    else if(m.type==="error"){add("err",m.text);setMode("idle")}};
  ws.onopen=()=>{if(mode==="idle")setMode("idle")};
  ws.onclose=()=>{setMode("idle");stateEl.textContent="Reconnecting";setTimeout(connect,3000)};
}
function send(text){if(!text||!ws||ws.readyState!==1)return;stopSpeaking();add("you",text);setMode("thinking");ws.send(JSON.stringify({text}))}

// ---- speaking: clone voice for English/Hindi when set up, otherwise the browser voice in the right language
const SCRIPTS=[["kn-IN",/[\u0C80-\u0CFF]/g],["te-IN",/[\u0C00-\u0C7F]/g],["hi-IN",/[\u0900-\u097F]/g],["ta-IN",/[\u0B80-\u0BFF]/g],
 ["ml-IN",/[\u0D00-\u0D7F]/g],["bn-IN",/[\u0980-\u09FF]/g],["gu-IN",/[\u0A80-\u0AFF]/g],["pa-IN",/[\u0A00-\u0A7F]/g],["ur-IN",/[\u0600-\u06FF]/g]];
function langOf(text){let best="en-IN",n=0;for(const [code,re] of SCRIPTS){const k=(text.match(re)||[]).length;if(k>n){n=k;best=code}}
  if(best==="hi-IN"&&LANG==="mr-IN")best="mr-IN";return best}
function pickVoice(code){const vs=speechSynthesis.getVoices(),base=code.split("-")[0];
  return vs.find(v=>v.lang.replace("_","-").toLowerCase()===code.toLowerCase())||vs.find(v=>v.lang.toLowerCase().startsWith(base))||null}
const warned={};
function stopSpeaking(){speechSynthesis.cancel();if(curAudio){curAudio.onended=null;curAudio.pause();curAudio=null}}
function pauseRec(){paused=true;if(rec){rec.onend=null;try{rec.abort()}catch(e){}}}
function doneSpeaking(){setMode("idle");paused=false;
  if(always)setTimeout(()=>{if(!paused)startRec()},700);else if(micOn)setTimeout(()=>{if(!paused)startRec()},300)}
async function say(text){
  stopSpeaking();if(!text)return;
  const code=langOf(text),base=code.split("-")[0];
  if(always||micOn)pauseRec();   // stop listening while talking, so Vega never hears herself
  if(cloneOn&&(base==="en"||base==="hi")){try{
    setMode("thinking");
    const r=await fetch("/speak",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text,lang:base})});
    if(!r.ok)throw 0;
    const a=new Audio(URL.createObjectURL(await r.blob()));curAudio=a;
    a.preservesPitch=true;a.mozPreservesPitch=true;a.webkitPreservesPitch=true;a.defaultPlaybackRate=SPEED;a.playbackRate=SPEED;
    a.onplay=()=>setMode("speaking");a.onended=()=>{curAudio=null;doneSpeaking()};
    return await a.play();
  }catch(e){}}
  const v=pickVoice(code);
  if(!v&&base!=="en"){
    if(!warned[code]){warned[code]=1;add("err",`This PC has no ${code} voice, so I can only show the text. Add one: Windows Settings > Time & language > Speech > Add voices.`)}
    doneSpeaking();return}
  const u=new SpeechSynthesisUtterance(text);u.rate=Math.min(SPEED,1.2);u.lang=code;if(v)u.voice=v;
  u.onstart=()=>setMode("speaking");u.onend=doneSpeaking;u.onerror=doneSpeaking;
  speechSynthesis.speak(u);
}
speechSynthesis.onvoiceschanged=()=>{};

// ---- hearing
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const WAKE=/\b(hey|hi|ok|okay)[ ,]+(vega|vegas|veda|vaiga|vegah|bega)\b/i;
function killRec(){if(rec){rec.onend=null;try{rec.abort()}catch(e){}rec=null}}
function restartRec(){killRec();setTimeout(()=>{if(!paused&&(always||micOn))startRec()},200)}
function heard(t){  // hands-free: react only after the wake word
  if(mode==="speaking"||mode==="thinking"||paused)return;
  if(Date.now()<armed){armed=0;send(t);restartRec();return}   // follow-up, heard in your chosen language
  const m=t.match(WAKE);
  if(m){const rest=t.slice(m.index+m[0].length).replace(/^[\s,.!?]+/,"");
    if(rest)send(rest);else{armed=Date.now()+8000;setMode("listening");restartRec()}}
}
function startRec(){
  if(!SR){add("err","Voice input needs Chrome or Edge. You can still type.");micOn=always=false;sync();return}
  if(paused)return;
  killRec();
  rec=new SR();rec.lang=always?(Date.now()<armed?LANG:"en-IN"):LANG;rec.continuous=always;rec.interimResults=false;
  rec.onstart=()=>{if(!always)setMode("listening")};
  rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(!r.isFinal)continue;
    const t=r[0].transcript.trim();if(t)always?heard(t):send(t)}};
  rec.onerror=ev=>{if(ev.error==="not-allowed"||ev.error==="service-not-allowed"){always=micOn=false;sync();setMode("idle");add("err","Microphone blocked. Allow it in Chrome's address bar, then try again.")}};
  rec.onend=()=>{if(paused)return;if(always)setTimeout(startRec,300);else if(mode==="listening")setMode("idle")};
  try{rec.start()}catch(e){}
}
function sync(){$("mic").setAttribute("aria-pressed",micOn);$("hf").setAttribute("aria-pressed",always)}
$("mic").onclick=()=>{micOn=!micOn;always=false;paused=false;sync();stopSpeaking();micOn?startRec():(killRec(),setMode("idle"))};
let greeting="",greeted=false;
$("hf").onclick=()=>{always=!always;micOn=false;paused=false;sync();stopSpeaking();
  if(always){if(greeting&&!greeted){greeted=true;say(greeting)}else startRec();setMode("idle")}else{killRec();setMode("idle")}};
$("spd").onchange=e=>{SPEED=parseFloat(e.target.value);store.set("vega-speed",String(SPEED))};
$("lang").onchange=e=>{LANG=e.target.value;store.set("vega-lang",LANG);if(micOn||always)restartRec()};
$("f").onsubmit=e=>{e.preventDefault();send($("t").value.trim());$("t").value=""};
setInterval(()=>{$("clock").textContent=new Date().toLocaleTimeString([],{hour12:false})},1000);

// ---- the core: rotating rings, reactive bars, a diffraction star and a blinking eye. Colour and tempo follow the state.
const cv=$("c"),g=cv.getContext("2d"),TAU=Math.PI*2,W=900,M=450;
let cur=[5,217,232];
const hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
function frame(t){
  const s=t/1000,sp=calm?.25:1;
  const tgt=hex(COLORS[mode]);cur=cur.map((v,i)=>v+(tgt[i]-v)*.08);
  const c=cur.map(Math.round).join(","),mg="255,42,109";
  const amp={idle:.14,listening:.4,thinking:.6,speaking:1}[mode];
  const pace={idle:.7,listening:1.6,thinking:3.2,speaking:2.4}[mode]*sp;
  const pulse=1+.07*Math.sin(s*pace*2);
  g.clearRect(0,0,W,W);
  const glow=g.createRadialGradient(M,M,0,M,M,330*pulse);
  glow.addColorStop(0,`rgba(${c},.5)`);glow.addColorStop(.3,`rgba(${c},.12)`);glow.addColorStop(1,`rgba(${c},0)`);
  g.fillStyle=glow;g.fillRect(0,0,W,W);
  g.save();g.translate(M,M);
  // outer tick ring (slow clockwise)
  g.save();g.rotate(s*.09*sp);g.strokeStyle=`rgba(${c},.55)`;
  for(let i=0;i<120;i++){const a=i/120*TAU,l=i%5?10:22;g.lineWidth=i%5?1.5:3;
    g.beginPath();g.moveTo(Math.cos(a)*420,Math.sin(a)*420);g.lineTo(Math.cos(a)*(420-l),Math.sin(a)*(420-l));g.stroke()}g.restore();
  // magenta/cyan segmented arcs, offset for a chromatic glitch look (counter-rotating)
  for(const [col,off,w] of [[mg,0,7],[c,3,3]]){
    g.save();g.rotate(-s*.35*pace*.6+off*.004);g.lineWidth=w;g.strokeStyle=`rgba(${col},.85)`;
    for(let i=0;i<6;i++){const a=i/6*TAU;g.beginPath();g.arc(off,off,376,a,a+TAU/6*(.35+.3*((i*37)%3)/2));g.stroke()}g.restore()}
  // dashed inner ring (clockwise, faster)
  g.save();g.rotate(s*.5*pace*.5);g.setLineDash([4,10]);g.lineWidth=2;g.strokeStyle=`rgba(${c},.6)`;
  g.beginPath();g.arc(0,0,330,0,TAU);g.stroke();g.restore();
  // reactive bars: voice-visualiser look
  g.save();g.rotate(-s*.12*sp);g.lineCap="round";g.lineWidth=5;
  for(let i=0;i<96;i++){const a=i/96*TAU;
    const v=amp*(.5+.5*Math.sin(i*1.7+s*pace*3)*Math.sin(i*.37-s*pace*2.1))+.05;
    const r0=205,r1=r0+8+110*v*(mode==="thinking"?.7+.3*Math.sin(s*6+i):1);
    g.strokeStyle=`rgba(${c},${.35+.6*v})`;g.beginPath();g.moveTo(Math.cos(a)*r0,Math.sin(a)*r0);g.lineTo(Math.cos(a)*r1,Math.sin(a)*r1);g.stroke()}g.restore();
  // thinking: radar sweep
  if(mode==="thinking"&&g.createConicGradient){const cg=g.createConicGradient(s*3,0,0);
    cg.addColorStop(0,`rgba(${mg},0)`);cg.addColorStop(.12,`rgba(${mg},.45)`);cg.addColorStop(.121,`rgba(${mg},0)`);cg.addColorStop(1,`rgba(${mg},0)`);
    g.fillStyle=cg;g.beginPath();g.arc(0,0,360,0,TAU);g.fill()}
  // four-point diffraction star
  for(const [len,w,rot] of [[360,5,0],[360,5,Math.PI/2],[210,3,Math.PI/4],[210,3,-Math.PI/4]]){
    g.save();g.rotate(rot+s*.05*sp);const lg=g.createLinearGradient(-len,0,len,0);
    lg.addColorStop(0,`rgba(${c},0)`);lg.addColorStop(.5,`rgba(${c},.85)`);lg.addColorStop(1,`rgba(${c},0)`);
    g.fillStyle=lg;g.beginPath();g.moveTo(-len*pulse,0);g.lineTo(0,-w);g.lineTo(len*pulse,0);g.lineTo(0,w);g.fill();g.restore()}
  // the eye: pulses, and blinks every few seconds
  const blink=(s%4.6)<.14?.12:1;
  g.fillStyle=`rgb(${c})`;g.shadowColor=`rgb(${c})`;g.shadowBlur=30;
  g.beginPath();g.ellipse(0,0,24*pulse,24*pulse*blink,0,0,TAU);g.fill();g.shadowBlur=0;
  g.strokeStyle=`rgba(${c},.8)`;g.lineWidth=2;g.beginPath();g.arc(0,0,40*pulse,0,TAU);g.stroke();
  g.restore();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);connect();
fetch("/config").then(r=>r.json()).then(c=>{cloneOn=c.clone;
  $("cModel").textContent=c.provider+" / "+c.model.split("/").pop();
  if(c.clone){$("cClone").textContent="voice: clone";$("cClone").classList.add("on")}
  if(c.google){$("cGoogle").textContent="google: on";$("cGoogle").classList.add("on")}
  const hr=new Date().getHours(),part=hr<12?"morning":hr<17?"afternoon":"evening";
  greeting=`Good ${part}${c.user?", "+c.user:""}. Vega online.`;add("vega",greeting)}).catch(()=>{});
</script>
</body>
</html>
